name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: izi
          POSTGRES_DB: izi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:26
        env:
          MYSQL_ROOT_PASSWORD: izi
          MYSQL_DATABASE: izi
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pizi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The isolation tests load the compiled worker-thread entry point, so the
      # build has to happen before the suite runs.
      - run: npm run build

      - name: Test (all three adapters)
        run: npm test
        env:
          IZI_TEST_POSTGRES_URL: postgres://postgres:izi@localhost:5432/izi
          IZI_TEST_MYSQL_URL: mysql://root:izi@localhost:3306/izi

  peer-range:
    name: better-sqlite3 ${{ matrix.better-sqlite3 }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keeps the declared peerDependencies range honest. The dev dependency
        # drifting past it is exactly how #50 shipped.
        #
        # Each driver is paired with the oldest Node it supports, because the
        # two constraints interact: better-sqlite3 12 requires Node 20+ and 13
        # requires Node 22+, so testing every driver on one modern Node hides
        # the combinations a user on an older runtime would actually hit.
        include:
          - better-sqlite3: '11'
            node: 18
          - better-sqlite3: '12'
            node: 20
          - better-sqlite3: '13'
            node: 22

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save better-sqlite3@^${{ matrix.better-sqlite3 }}.0.0
      - run: npm run build
      - name: SQLite suites
        run: npx jest tests/sqlite-adapter.test.ts tests/retry.test.ts tests/rescue.test.ts tests/lifecycle.test.ts

  pack:
    name: Package installs cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --pack-destination /tmp

      # Guards the failure mode from #50, where the published package could not
      # be installed at all next to a current better-sqlite3.
      - name: Install the tarball into a clean project
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm pkg set type=module > /dev/null
          npm install /tmp/izi-queue-*.tgz better-sqlite3
          node -e "import('izi-queue').then(m => {
            if (typeof m.IziQueue !== 'function') { throw new Error('entry point did not resolve'); }
            console.log('izi-queue resolves, exports', Object.keys(m).length, 'symbols');
          })"

      # The unit tests run under CommonJS, so they cannot catch ESM-only
      # breakage. Worker isolation shipped broken for exactly that reason: the
      # published package is ESM, and the path resolver used `require`. This
      # runs a real isolated job through the packed tarball.
      - name: Run an isolated job through the packed tarball
        run: |
          cd /tmp/consumer
          mkdir -p workers
          cat > workers/double.js <<'WORKER'
          export async function perform(job) {
            return { status: 'ok', value: { doubled: job.args.n * 2 } };
          }
          WORKER
          cat > isolation-check.mjs <<'CHECK'
          import Database from 'better-sqlite3';
          import { IziQueue, defineWorker, createSQLiteAdapter } from 'izi-queue';
          import { join } from 'path';

          const queue = new IziQueue({
            database: createSQLiteAdapter(new Database(':memory:')),
            queues: { default: 2 },
            pollInterval: 50,
            stageInterval: 50,
            isolation: { maxThreads: 2 },
          });

          queue.register(defineWorker('double', async () => ({ status: 'ok' }), {
            isolation: { isolated: true, workerPath: join(process.cwd(), 'workers/double.js') },
          }));

          await queue.migrate();
          await queue.start();
          const job = await queue.insert('double', { args: { n: 21 } });

          const deadline = Date.now() + 15000;
          let final;
          while (Date.now() < deadline) {
            final = await queue.getJob(job.id);
            if (final && final.state !== 'available' && final.state !== 'executing') break;
            await new Promise(r => setTimeout(r, 50));
          }

          await queue.stop();

          if (final?.state !== 'completed') {
            console.error('isolated job did not complete:', final?.state, final?.errors?.[0]?.error);
            process.exit(1);
          }
          console.log('isolated job completed in an ESM consumer');
          process.exit(0);
          CHECK
          node isolation-check.mjs
